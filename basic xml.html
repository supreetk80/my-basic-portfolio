
    <!DOCTYPE html>
<html>
<head>
    <title>XML Basics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .xml-box {
            background-color: white;
            border: 2px solid darkblue;
            padding: 20px;
            width: 600px;
            margin: auto;
        }

        .tag {
            color: darkred;
        }
    </style>
</head>

<body>

    <h1>XML Basics</h1>

    <div class="xml-box">

        <h2>Student Information</h2>

        <pre>
<span class="tag">&lt;student&gt;</span>

    <span class="tag">&lt;name&gt;</span>Supreet Kaur<span class="tag">&lt;/name&gt;</span>

    <span class="tag">&lt;course&gt;</span>BCA<span class="tag">&lt;/course&gt;</span>

    <span class="tag">&lt;semester&gt;</span>6th Semester<span class="tag">&lt;/semester&gt;</span>

    <span class="tag">&lt;college&gt;</span> KCMT College<span class="tag">&lt;/college&gt;</span>

<span class="tag">&lt;/student&gt;</span>
        </pre>

    </div>

</body>
</html>
</body>
</html>
