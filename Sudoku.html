<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f2937, #111827);
            color: #fff;
        }

        .game {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: min(90vw, 420px);
        }

        h1 {
            text-align: center;
            margin: 0 0 18px;
            font-size: 2rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            border: 3px solid #fbbf24;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #111827;
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s ease;
            user-select: none;
        }

        .cell:hover {
            background: #e2e8f0;
        }

        .cell.fixed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .cell.selected {
            background: #fef3c7;
            border: 2px solid #f59e0b;
        }

        .cell.wrong {
            background: #fee2e2;
            color: #b91c1c;
        }

        .cell:nth-child(3n) {
            border-right: 2px solid #475569;
        }

        .cell:nth-child(9n) {
            border-right: 1px solid #cbd5e1;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54),
        .cell:nth-child(n+73):nth-child(-n+81) {
            border-bottom: 2px solid #475569;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 18px;
        }

        .num-btn {
            background: #fbbf24;
            color: #111827;
            font-weight: 700;
        }

        .clear-btn {
            background: #ef4444;
            color: white;
        }

        .reset-btn {
            background: #10b981;
            color: white;
        }

        .status {
            margin-top: 16px;
            text-align: center;
            min-height: 24px;
            font-weight: 600;
            color: #fef3c7;
        }
    </style>
</head>
<body>
    <div class="game">
        <h1>Sudoku</h1>
        <div id="board" class="board" aria-label="Sudoku board"></div>

        <div class="controls">
            <button class="reset-btn" id="resetBtn">Reset</button>
            <button id="checkBtn">Check</button>
        </div>

        <div class="number-pad" id="numberPad"></div>
        <div id="status" class="status"></div>
    </div>

    <script>
        const puzzle = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        const solution = [
            [5, 3, 4, 6, 7, 8, 9, 1, 2],
            [6, 7, 2, 1, 9, 5, 3, 4, 8],
            [1, 9, 8, 3, 4, 2, 5, 6, 7],
            [8, 5, 9, 7, 6, 1, 4, 2, 3],
            [4, 2, 6, 8, 5, 3, 7, 9, 1],
            [7, 1, 3, 9, 2, 4, 8, 5, 6],
            [9, 6, 1, 5, 3, 7, 2, 8, 4],
            [2, 8, 7, 4, 1, 9, 6, 3, 5],
            [3, 4, 5, 2, 8, 6, 1, 7, 9]
        ];

        let board = puzzle.map(row => [...row]);
        let selectedCell = null;

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const numberPad = document.getElementById('numberPad');

        function createBoard() {
            boardElement.innerHTML = '';

            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    if (puzzle[row][col] !== 0) {
                        cell.classList.add('fixed');
                        cell.textContent = puzzle[row][col];
                    }

                    cell.addEventListener('click', () => {
                        selectedCell = { row, col };
                        renderBoard();
                    });

                    boardElement.appendChild(cell);
                }
            }

            renderBoard();
        }

        function renderBoard() {
            const cells = boardElement.children;

            for (let i = 0; i < cells.length; i++) {
                const row = Number(cells[i].dataset.row);
                const col = Number(cells[i].dataset.col);
                const value = board[row][col];

                cells[i].textContent = value === 0 ? '' : value;
                cells[i].classList.remove('selected', 'wrong');

                if (puzzle[row][col] !== 0) {
                    cells[i].classList.add('fixed');
                } else {
                    cells[i].classList.remove('fixed');
                }

                if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                    cells[i].classList.add('selected');
                }

                if (value !== 0 && isWrongPlacement(row, col, value)) {
                    cells[i].classList.add('wrong');
                }
            }
        }

        function createNumberPad() {
            const values = [1, 2, 3, 4, 5, 6, 7, 8, 9, 'Clear'];

            values.forEach(value => {
                const btn = document.createElement('button');
                btn.className = 'num-btn';

                if (value === 'Clear') {
                    btn.classList.add('clear-btn');
                    btn.textContent = 'Clear';
                    btn.addEventListener('click', () => {
                        if (selectedCell) {
                            const { row, col } = selectedCell;
                            if (puzzle[row][col] === 0) {
                                board[row][col] = 0;
                                renderBoard();
                            }
                        }
                    });
                } else {
                    btn.textContent = value;
                    btn.addEventListener('click', () => {
                        if (selectedCell) {
                            const { row, col } = selectedCell;
                            if (puzzle[row][col] === 0) {
                                board[row][col] = value;
                                renderBoard();
                                checkWin();
                            }
                        }
                    });
                }

                numberPad.appendChild(btn);
            });
        }

        function isWrongPlacement(row, col, value) {
            if (value === 0) return false;

            for (let i = 0; i < 9; i++) {
                if (i !== col && board[row][i] === value) return true;
                if (i !== row && board[i][col] === value) return true;
            }

            const startRow = Math.floor(row / 3) * 3;
            const startCol = Math.floor(col / 3) * 3;

            for (let r = startRow; r < startRow + 3; r++) {
                for (let c = startCol; c < startCol + 3; c++) {
                    if ((r !== row || c !== col) && board[r][c] === value) {
                        return true;
                    }
                }
            }

            return false;
        }

        function checkWin() {
            let isComplete = true;

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 0 || board[r][c] !== solution[r][c]) {
                        isComplete = false;
                    }
                }
            }

            if (isComplete) {
                statusElement.textContent = 'You solved it! 🎉';
                statusElement.style.color = '#86efac';
            } else if (board.flat().includes(0)) {
                statusElement.textContent = 'Keep going!';
                statusElement.style.color = '#fef3c7';
            } else {
                statusElement.textContent = 'Some numbers are wrong.';
                statusElement.style.color = '#fca5a5';
            }
        }

        document.getElementById('checkBtn').addEventListener('click', () => {
            const filled = board.flat().every(v => v !== 0);
            if (!filled) {
                statusElement.textContent = 'Fill all cells first.';
                statusElement.style.color = '#fef3c7';
                return;
            }

            const solved = board.every((row, r) => row.every((value, c) => value === solution[r][c]));
            statusElement.textContent = solved ? 'Correct! You win! 🏆' : 'Not quite. Try again.';
            statusElement.style.color = solved ? '#86efac' : '#fca5a5';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            board = puzzle.map(row => [...row]);
            selectedCell = null;
            statusElement.textContent = '';
            renderBoard();
        });

        document.addEventListener('keydown', (event) => {
            if (selectedCell === null) return;

            const { row, col } = selectedCell;

            if (puzzle[row][col] !== 0) return;

            if (event.key >= '1' && event.key <= '9') {
                board[row][col] = Number(event.key);
                renderBoard();
                checkWin();
            } else if (event.key === 'Backspace' || event.key === 'Delete' || event.key === '0') {
                board[row][col] = 0;
                renderBoard();
                statusElement.textContent = '';
            }
        });

        createBoard();
        createNumberPad();
    </script>
</body>
</html>
