<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>
</head>

<body>

<h1>BCA Online Examination</h1>

<form id="exam">

    <h3>1. Which language creates webpages?</h3>

    <input type="radio" name="q1" value="1"> HTML
    <input type="radio" name="q1" value="0"> SQL

    <h3>2. Which language is used for styling?</h3>

    <input type="radio" name="q2" value="1"> CSS
    <input type="radio" name="q2" value="0"> Java

    <h3>3. Which language adds interactivity?</h3>

    <input type="radio" name="q3" value="1"> JavaScript
    <input type="radio" name="q3" value="0"> HTML

    <br><br>

    <button type="button" onclick="submitExam()">
        Submit Exam
    </button>

</form>

<h2 id="result"></h2>

<script>

function submitExam() {

    let score = 0;

    let answers =
        document.querySelectorAll(
            'input[type="radio"]:checked'
        );

    answers.forEach(function(answer) {
        score += Number(answer.value);
    });

    document.getElementById("result").innerHTML =
        "Your Score: " + score + "/3";
}

</script>

</body>
</html>
