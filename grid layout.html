<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .box {
            background: #ddd;
            padding: 40px;
            text-align: center;
            font-size: 20px;
        }

        .large {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<h1 align="center">CSS Grid Layout</h1>

<div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box large">Box 4</div>
    <div class="box">Box 5</div>
</div>

</body>
</html>
