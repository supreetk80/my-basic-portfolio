<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navbar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background: #222;
            display: flex;
            justify-content: space-around;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
        }

        nav a:hover {
            background: #555;
            border-radius: 5px;
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<h1 align="center">Welcome to My Website</h1>

</body>
</html>
