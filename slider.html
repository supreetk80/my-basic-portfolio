<!DOCTYPE html>
<html>
<head>
    <title>Image Slider</title>

    <style>
        .slider {
            width: 600px;
            margin: 50px auto;
            text-align: center;
        }

        .slider img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        button {
            padding: 10px 25px;
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="slider">

<h1>Image Slider</h1>

<img id="image" src="image1.jpg">

<br>

<button onclick="previous()">Previous</button>
<button onclick="next()">Next</button>

</div>

<script>

let images = [
    "image1.jpg",
    "image2.jpg",
    "image3.jpg",
    "image4.jpg"
];

let index = 0;

function next() {

    index++;

    if (index >= images.length) {
        index = 0;
    }

    document.getElementById("image").src =
        images[index];
}

function previous() {

    index--;

    if (index < 0) {
        index = images.length - 1;
    }

    document.getElementById("image").src =
        images[index];
}

</script>

</body>
</html>
