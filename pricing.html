<!DOCTYPE html>
<html>
<head>
    <title>Pricing Table</title>

    <style>
        .pricing {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .plan {
            width: 250px;
            padding: 30px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 10px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
        }

        button {
            padding: 10px 25px;
        }
    </style>
</head>

<body>

<h1 align="center">Our Plans</h1>

<div class="pricing">

    <div class="plan">
        <h2>Basic</h2>
        <p class="price">₹499</p>
        <p>5 Projects</p>
        <p>Basic Support</p>
        <button>Choose</button>
    </div>

    <div class="plan">
        <h2>Standard</h2>
        <p class="price">₹999</p>
        <p>15 Projects</p>
        <p>Priority Support</p>
        <button>Choose</button>
    </div>

    <div class="plan">
        <h2>Premium</h2>
        <p class="price">₹1499</p>
        <p>Unlimited Projects</p>
        <p>24/7 Support</p>
        <button>Choose</button>
    </div>

</div>

</body>
</html>
