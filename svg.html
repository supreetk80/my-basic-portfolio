<!DOCTYPE html>
<html>
<head>
    <title>SVG Graphics</title>
</head>

<body>

<h1>SVG Shapes</h1>

<svg width="600" height="400">

    <rect x="50" y="50"
          width="150"
          height="100"
          fill="skyblue"
          stroke="black"/>

    <circle cx="350"
            cy="100"
            r="60"
            fill="orange"
            stroke="black"/>

    <line x1="50"
          y1="250"
          x2="500"
          y2="250"
          stroke="black"
          stroke-width="5"/>

    <text x="180" y="330"
          font-size="30">
        SVG Graphics
    </text>

</svg>

</body>
</html>
