<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Table</title>
</head>
<body>
    <h1>Student Table</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John Doe</td>
                <td>20</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Jane Smith</td>
                <td>22</td>
                <td>B</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
